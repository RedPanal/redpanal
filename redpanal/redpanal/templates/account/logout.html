{% extends "account/base.html" %}
{% load i18n %}

{% block title %}{% trans "Log out" %}{% endblock %}

{% block content %}
<div class="rp-narrow rp-auth">
 <h1 class="rp-h1">{% trans "Log out" %}</h1>
 <form method="post" action="{% url 'account_logout' %}" class="d-flex gap-2 align-items-center">
  {% csrf_token %}
  {% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
  <button class="btn rp-btn-primary" type="submit">{% trans "Log out" %}</button>
  <a class="btn btn-link" href="{% url 'index' %}">{% trans "Cancel" %}</a>
 </form>
</div>
{% endblock %}
