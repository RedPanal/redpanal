{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>RedPanal</title>
 <style>
  body { font-family: system-ui, sans-serif; color: #1d2b36; background: #fff; margin: 0; padding: 48px 16px; text-align: center; }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  p { color: #51606b; line-height: 1.5; }
  button { min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #1d2b36; color: #fff; font: inherit; }
 </style>
</head>
<body>
 <main>
  <h1>{% trans "No connection" %}</h1>
  <p>{% trans "RedPanal needs the internet to show this page. What you were uploading waits in this device and goes out by itself when the signal comes back." %}</p>
  <button type="button" onclick="location.reload()">{% trans "Try again" %}</button>
 </main>
</body>
</html>
