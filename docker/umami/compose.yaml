# Umami: visit statistics for RedPanal, on the same server (see ESTADISTICAS.md).
#
#   cp docker/umami/.env.example docker/umami/.env   # and fill in the secrets
#   docker compose -f docker/umami/compose.yaml up -d
#
# It listens only on 127.0.0.1:3000: the web server publishes it as https://stats.redpanal.org.
# Pin the image to the version you tested (for example postgresql-v2.x.y) instead of "latest" before deploying.
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umami-db:
